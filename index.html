<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dispersed client portal – V3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="bar">
      <a class="logo" href="#overview">
        <span class="header-brand-mark"><img src="dispersed-logo.png" alt="" width="42" height="30"></span>
        <span>Dispersed</span>
      </a>
      <select id="pal" aria-label="Color palette">
        <option value="">Charcoal and rust</option>
        <option value="1">Deep teal and slate</option>
        <option value="2">Navy and forest</option>
      </select>
    </div>
  </header>
  <div class="shell">
    <aside>
      <nav id="nav" aria-label="Main"></nav>
      <div class="asf">
        <span class="av">RP</span>
        <div><b>Raees Pritchard</b><span class="muted">Sustainability</span></div>
      </div>
    </aside>
    <main id="app"></main>
  </div>
  <script src="branding.js"></script>
  <script src="layouts.js"></script>
  <script src="portal.js"></script>
</body>
</html>
